# Baseline: two hidden layers, ReLU, light dropout.
# Every other config changes exactly ONE thing from this file, so the
# comparison in the runs table is a controlled experiment.
# Write small decimals as 0.0001, not 1e-4 (PyYAML reads 1e-4 as a string).
name: baseline-relu
hidden_sizes: [128, 64]
activation: relu
dropout: 0.2
lr: 0.001
weight_decay: 0.0001
batch_size: 256
epochs: 60
patience: 8      # stop after this many epochs without a better validation loss
seed: 42